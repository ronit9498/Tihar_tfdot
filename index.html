<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tihar Lights</title>
  <meta name="description" content="Turn on the Tihar lights and explore the five days of Tihar.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;600&family=Rakkas&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" id="scene">
    <svg class="lights" id="lights" aria-hidden="true">
      <defs>
        <radialGradient id="glow">
          <stop offset="0" stop-color="#fff1a8" stop-opacity=".85"></stop>
          <stop offset="1" stop-color="#ffc857" stop-opacity="0"></stop>
        </radialGradient>
      </defs>
      <g id="strands"></g>
    </svg>

    <div class="center">
      <button class="switch" id="switch" type="button" aria-pressed="false" aria-label="Turn the lights on">
        <span class="rocker"></span>
      </button>
      <div class="caption" aria-live="polite">
        <p class="hint">Press the switch</p>
        <p class="greet">Happy Tihar!</p>
      </div>
    </div>

    <a class="cue" href="#about">Discover Tihar</a>
  </main>

  <section class="after-lit" id="about">
    <div class="days">
      <h2>Why light a diyo?</h2>
      <p>In Tihar, light pushes the dark away. A small flame in every window tells the whole street that someone is welcome here.</p>
    </div>
  </section>

  <footer class="blessing">
    <div class="blessing-diya" id="blessingDiya" aria-hidden="true"></div>
    <p>May the lights of Tihar brighten every corner of your life.</p>
  </footer>

  <script src="tabs.js"></script>
  <script src="script.js"></script>
</body>
</html>
