<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The five days of Tihar</title>
  <meta name="description" content="Turn on the Tihar lights and explore the five days of Tihar.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;600&family=Rakkas&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" id="scene">
    <div class="night-scene" aria-hidden="true">
      <span class="star s1"></span>
      <span class="star s2"></span>
      <span class="star s3"></span>
      <span class="star s4"></span>
      <span class="star s5"></span>
      <span class="star s6"></span>
      <span class="firefly f1"></span>
      <span class="firefly f2"></span>
      <span class="firefly f3"></span>
      <span class="firefly f4"></span>
      <span class="firefly f5"></span>
      <span class="firefly f6"></span>
      <div class="moon"></div>
      <div class="hills hill-back"></div>
      <div class="hills hill-front"></div>
      <div class="house house-l"><i></i><i></i></div>
      <div class="house house-r"><i></i><i></i></div>
    </div>

    <svg class="mdl l" viewBox="0 0 200 200" fill="none" stroke="#ffc857" stroke-width=".9" aria-hidden="true"></svg>
    <svg class="mdl r" viewBox="0 0 200 200" fill="none" stroke="#ffc857" stroke-width=".9" aria-hidden="true"></svg>
    <svg class="mdl c" viewBox="0 0 200 200" fill="none" stroke="#ffc857" stroke-width="1" aria-hidden="true"></svg>

    <svg class="lights" id="lights" aria-hidden="true"><g id="strands"></g></svg>
    <canvas id="fx" aria-hidden="true"></canvas>

    <div class="center">
      <button class="switch" id="switch" type="button" aria-pressed="false" aria-label="Turn the lights on">
        <span class="rocker"></span>
      </button>
      <div class="caption" aria-live="polite">
        <p class="hint">Press the switch</p>
        <p class="greet">Happy Tihar!</p>
      </div>
    </div>

    <div class="diyos" id="diyos" aria-hidden="true"></div>

    <p class="day-hint">Explore the five days</p>
    <div class="tabs" id="tabs" role="tablist" aria-label="The five days of Tihar"></div>

  </main>

  <section class="after-lit" id="about">
    <div class="days">
      <svg class="bgm" id="bgm" viewBox="0 0 200 200" fill="none" stroke="#ffc857" stroke-width=".8" aria-hidden="true"></svg>
      <h2>The five days</h2>
      <div class="card" id="day-panel" role="tabpanel" aria-labelledby="day-tab-0" tabindex="0"></div>
    </div>
  </section>

  <footer class="blessing">
    <div class="blessing-diya" id="blessingDiya" aria-hidden="true"></div>
    <p>May the lights of Tihar brighten every corner of your life.</p>
  </footer>

  <script src="tabs.js"></script>
  <script src="script.js"></script>
</body>
</html>
